<!DOCTYPE html>
<html>

<head>

    <title>Semi-calcolatrice</title>

    <style>

        body {
            font-family: Arial;
            background-color: #F7F8F6;
            color: #4A5550;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            flex-direction: column;
        }

        h2 {
            color: #687D73;
        }

        .contenitore {
            width: 300px;
            padding: 25px;
            background-color: white;
            border: 1px solid #DCE5DF;
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(100,125,110,0.08);
        }

        input {
            width: 95%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #D9E2DC;
            border-radius: 7px;
            background-color: #FAFCFA;
        }

        button {
            width: 65px;
            padding: 12px;
            margin: 4px;
            background-color: #A9C4B3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background-color: #8EAD9B;
        }

        .uguale {
            width: 95%;
            background-color: #819F8C;
        }

        #risultato {
            margin-top: 20px;
            padding: 15px;
            background-color: #EDF3EE;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }

    </style>

</head>

<body>

    <h2>Semi-calcolatrice</h2>

    <div class="contenitore">

        <label>Primo numero</label>
        <input type="text" id="n1">

        <label>Secondo numero</label>
        <input type="text" id="n2">

        <br>

        <button onclick="somma()">+</button>

        <button onclick="sottrazione()">-</button>

        <button onclick="moltiplicazione()">*</button>

        <button onclick="divisione()">/</button>

        <button class="uguale" onclick="calcola()">=</button>

        <div id="risultato">
            Risultato:
        </div>

    </div>


    <script>

        let numero1;
        let numero2;
        let risultato;
        let operazione = "";

        function somma() {

            operazione = "+";

        }

        function sottrazione() {

            operazione = "-";

        }

        function moltiplicazione() {

            operazione = "*";

        }

        function divisione() {

            operazione = "/";

        }


        function calcola() {

            numero1 = Number(document.getElementById("n1").value);

            numero2 = Number(document.getElementById("n2").value);

            if (document.getElementById("n1").value == "" ||
                document.getElementById("n2").value == "") {

                alert("Inserire entrambi i numeri!");
                return;

            }

            if (operazione == "+") {

                risultato = numero1 + numero2;

            }

            else if (operazione == "-") {

                risultato = numero1 - numero2;

            }

            else if (operazione == "*") {

                risultato = numero1 * numero2;

            }

            else if (operazione == "/") {

                if (numero2 == 0) {

                    alert("Non puoi dividere per zero!");
                    return;

                }

                risultato = numero1 / numero2;

            }

            else {

                alert("Seleziona un'operazione!");
                return;

            }

            document.getElementById("risultato").innerHTML =
                "Risultato: " + risultato;

        }

    </script>

</body>

</html>
