
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Semi-calcolatrice</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #F7F8F6;
            color: #4A5550;
        }

        h2 {
            color: #687D73;
        }

        .contenitore {
            width: 320px;
            padding: 25px;
            border: 1px solid #DCE5DF;
            border-radius: 14px;
            background-color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(100,125,110,0.08);
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #65766D;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #D9E2DC;
            border-radius: 7px;
            background-color: #FAFCFA;
            box-sizing: border-box;
            font-size: 16px;
        }

        .pulsanti {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            background-color: #A9C4B3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background-color: #8EAD9B;
        }

        .uguale {
            grid-column: span 2;
            background-color: #819F8C;
        }

        .risultato {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #EDF3EE;
            color: #52685B;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

    </style>

</head>

<body>

    <h2>Semi-calcolatrice</h2>

    <div class="contenitore">

        <div class="campo">
            <label>Primo numero:</label>
            <input type="text" id="numero1">
        </div>

        <div class="campo">
            <label>Secondo numero:</label>
            <input type="text" id="numero2">
        </div>

        <div class="pulsanti">

            <button type="button" onclick="selezionaOperazione('+')">+</button>

            <button type="button" onclick="selezionaOperazione('-')">-</button>

            <button type="button" onclick="selezionaOperazione('*')">*</button>

            <button type="button" onclick="selezionaOperazione('/')">/</button>

            <button type="button" class="uguale" onclick="calcola()">=</button>

        </div>

        <div class="risultato" id="risultato">
            Risultato:
        </div>

    </div>


    <script>

    

        let operazione = "";


        

        function selezionaOperazione(simbolo) {

            operazione = simbolo;

            document.getElementById("risultato").innerHTML =
                "Operazione selezionata: " + simbolo;

        }


    

        function calcola() {

            

            let n1 = document.getElementById("numero1").value;
            let n2 = document.getElementById("numero2").value;

          

            if (n1.trim() === "" || n2.trim() === "") {

                alert("Inserire entrambi i numeri!");
                return;

            }

    

            n1 = Number(n1.replace(",", "."));
            n2 = Number(n2.replace(",", "."));

            if (!Number.isFinite(n1) || !Number.isFinite(n2)) {

                alert("Inserire numeri validi!");
                return;

            }

           

            if (operazione === "") {

                alert("Selezionare un'operazione!");
                return;

            }

            let risultato;

            // Eseguo il calcolo

            if (operazione === "+") {

                risultato = n1 + n2;

            }
            else if (operazione === "-") {

                risultato = n1 - n2;

            }
            else if (operazione === "*") {

                risultato = n1 * n2;

            }
            else if (operazione === "/") {

                if (n2 === 0) {

                    alert("Non puoi dividere per zero!");
                    return;

                }

                risultato = n1 / n2;

            }
