
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semi-calcolatrice</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #F7F8F6;
            color: #4A5550;
        }

        h2 {
            color: #687D73;
        }

        .contenitore {
            width: 320px;
            padding: 25px;
            border: 1px solid #DCE5DF;
            border-radius: 14px;
            background-color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(100, 125, 110, 0.08);
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #65766D;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #D9E2DC;
            border-radius: 7px;
            background-color: #FAFCFA;
            color: #4A5550;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #A8C3B1;
        }

        .pulsanti {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            background-color: #A9C4B3;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
        }

        button:hover {
            background-color: #8EAD9B;
        }

        button.selezionato {
            background-color: #617E6B;
        }

        .uguale {
            grid-column: span 2;
            background-color: #819F8C;
            font-weight: bold;
        }

        .risultato {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #EDF3EE;
            color: #52685B;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            min-height: 25px;
        }

    </style>

</head>

<body>

    <h2>Semi-calcolatrice</h2>

    <div class="contenitore">

        <div class="campo">
            <label for="numero1">Primo numero:</label>
            <input type="text" id="numero1">
        </div>

        <div class="campo">
            <label for="numero2">Secondo numero:</label>
            <input type="text" id="numero2">
        </div>

        <div class="pulsanti">

            <button id="somma" onclick="seleziona('+')">+</button>

            <button id="sottrazione" onclick="seleziona('-')">-</button>

            <button id="moltiplicazione" onclick="seleziona('*')">*</button>

            <button id="divisione" onclick="seleziona('/')">/</button>

            <button class="uguale" onclick="calcola()">=</button>

        </div>

        <div class="risultato" id="risultato">
            Risultato:
        </div>

    </div>


    <script>

       

        let operazione = "";


      

        function seleziona(simbolo) {

            operazione = simbolo;

    

            document.querySelectorAll(".pulsanti button")
                .forEach(function(pulsante) {
                    pulsante.classList.remove("selezionato");
                });

           

            let pulsanteScelto;

            if (simbolo === "+") {
                pulsanteScelto = "somma";
            }
            else if (simbolo === "-") {
                pulsanteScelto = "sottrazione";
            }
            else if (simbolo === "*") {
                pulsanteScelto = "moltiplicazione";
            }
            else if (simbolo === "/") {
                pulsanteScelto = "divisione";
            }

            document.getElementById(pulsanteScelto)
                .classList.add("selezionato");

        }


  

        function calcola() {

         

            let valore1 = document.getElementById("numero1").value.trim();
            let valore2 = document.getElementById("numero2").value.trim();

          

            if (valore1 === "" || valore2 === "") {

                alert("Inserire entrambi i numeri!");
                return;

            }

            let n1 = Number(valore1.replace(",", "."));
            let n2 = Number(valore2.replace(",", "."));

           

            if (!Number.isFinite(n1) || !Number.isFinite(n2)) {

                alert("Inserire solamente numeri validi!");
                return;

            }

            

            if (operazione === "") {

                alert("Selezionare un'operazione!");
                return;

            }

            let risultato;

            switch (operazione) {

                case "+":
                    risultato = n1 + n2;
                    break;

                case "-":
                    risultato = n1 - n2;
                    break;

                case "*":
                    risultato = n1 * n2;
                    break;

                case "/":

                    if (n2 === 0) {

                        alert("Impossibile dividere per zero!");
                        return;

                    }

                    risultato = n1 / n2;
                    break;

            }

          

            document.getElementById("risultato").textContent =
                "Risultato: " + risultato;

        }

    </script>

</body>

</html>
            }
