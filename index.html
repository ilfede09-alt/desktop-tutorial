<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Federico Spanò — Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #eeeee7;
    color: #424940;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    padding: 8%;
}

.container {
    max-width: 1100px;
    margin: auto;
}

/* NOME */

.name {
    font-size: clamp(55px, 12vw, 145px);
    font-weight: 600;
    letter-spacing: -8px;
    line-height: 0.88;
    color: #526456;
    margin-bottom: 65px;
}

/* SOTTOTITOLO */

.subtitle {
    color: #92988b;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 25px;
}

/* PROGETTI */

.works {
    border-top: 1px solid #d4d8cd;
}

.work {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 8px;
    border-bottom: 1px solid #d4d8cd;
    color: #525c51;
    text-decoration: none;
    font-size: clamp(18px, 3vw, 27px);
    transition: all 0.35s ease;
}

.work:hover {
    color: #899b83;
    padding-left: 20px;
}

.arrow {
    font-size: 22px;
    color: #899b83;
    transition: transform 0.35s ease;
}

.work:hover .arrow {
    transform: translate(5px, -5px);
}

/* FOOTER */

footer {
    margin-top: 85px;
    color: #a1a597;
    font-size: 11px;
    letter-spacing: 3px;
}

/* MOBILE */

@media (max-width: 600px) {
    body {
        padding: 10% 7%;
    }

    .name {
        letter-spacing: -4px;
        margin-bottom: 55px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="name">
        FEDERICO<br>
        SPANÒ
    </h1>

    <p class="subtitle">SELECTED WORKS — 2026</p>

    <div class="works">

        <!-- AGGIUNGI QUI I TUOI LAVORI -->

        <a href="anagrafica.html" target="_blank" rel="noopener noreferrer" class="work">
            <span>Anagrafica 1.0</span>
            <span class="arrow">↗</span>
        </a>

        <a href="calcolatrice.html" target="_blank" rel="noopener noreferrer" class="work">
            <span>Calcolatrice 1.0</span>
            <span class="arrow">↗</span>
        </a>

        <a href="https://example.com" target="_blank" rel="noopener noreferrer" class="work">
            <span>Progetto 03</span>
            <span class="arrow">↗</span>
        </a>

        <!-- FINE LAVORI -->

    </div>

    <footer>
        © 2026 FEDERICO SPANÒ
    </footer>

</div>

</body>
</html>
