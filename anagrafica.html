<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserimento dati anagrafici</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #F7F8F6;
            color: #4A5550;
        }

        h2 {
            color: #687D73;
        }

        .contenitore {
            width: 400px;
            padding: 25px;
            border: 1px solid #DCE5DF;
            border-radius: 14px;
            background-color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(100, 125, 110, 0.08);
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #65766D;
            font-weight: 600;
        }

        input {
            width: 95%;
            padding: 9px;
            border: 1px solid #D9E2DC;
            border-radius: 7px;
            background-color: #FAFCFA;
            color: #4A5550;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #A8C3B1;
            background-color: #FFFFFF;
        }

        button {
            padding: 11px 20px;
            background-color: #A9C4B3;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #8EAD9B;
        }

        table {
            margin-top: 25px;
            border-collapse: collapse;
            width: 100%;
            background-color: #FFFFFF;
        }

        th, td {
            border: 1px solid #E3EAE5;
            padding: 11px;
            text-align: left;
        }

        th {
            background-color: #DCE9E0;
            color: #52685B;
        }

        tbody tr:nth-child(even) {
            background-color: #F5F8F5;
        }

        tbody tr:hover {
            background-color: #EDF3EE;
        }

    </style>

</head>

<body>

    <h2>Inserimento dati anagrafici</h2>

    <!-- GABBIA GRAFICA -->
    <div class="contenitore">

        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome">
        </div>

        <div class="campo">
            <label for="cognome">Cognome:</label>
            <input type="text" id="cognome">
        </div>

        <div class="campo">
            <label for="indirizzo">Indirizzo:</label>
            <input type="text" id="indirizzo">
        </div>

        <div class="campo">
            <label for="citta">Città:</label>
            <input type="text" id="citta">
        </div>

        <div class="campo">
            <label for="eta">Età:</label>
            <input type="number" id="eta" min="0">
        </div>

        <button type="button" onclick="aggiungiDati()">
            Aggiungi alla tabella
        </button>

    </div>


    <!-- TABELLA DINAMICA -->
    <h2>Elenco persone</h2>

    <table id="tabella">

        <thead>
            <tr>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Indirizzo</th>
                <th>Città</th>
                <th>Età</th>
            </tr>
        </thead>

        <tbody id="corpoTabella">
        </tbody>

    </table>


    <!-- JAVASCRIPT -->
    <script>

        function aggiungiDati() {

            // Recupero i valori dagli input
            let nome = document.getElementById("nome").value;
            let cognome = document.getElementById("cognome").value;
            let indirizzo = document.getElementById("indirizzo").value;
            let citta = document.getElementById("citta").value;
            let eta = document.getElementById("eta").value;

            // Controllo che tutti i campi siano compilati
            if (nome.trim() === "" ||
                cognome.trim() === "" ||
                indirizzo.trim() === "" ||
                citta.trim() === "" ||
                eta === "") {

                alert("Compilare tutti i campi!");
                return;
            }

            // Recupero il corpo della tabella
            let tabella = document.getElementById("corpoTabella");

            // Creo una nuova riga
            let riga = tabella.insertRow(-1);

            // Inserisco i dati in un array
            let dati = [nome, cognome, indirizzo, citta, eta];

            // Creo dinamicamente le celle
            for (let i = 0; i < dati.length; i++) {

                let cella = riga.insertCell(i);

                cella.textContent = dati[i];

            }

            // Svuoto i campi dopo l'inserimento
            document.getElementById("nome").value = "";
            document.getElementById("cognome").value = "";
            document.getElementById("indirizzo").value = "";
            document.getElementById("citta").value = "";
            document.getElementById("eta").value = "";

        }

    </script>

</body>

</html>
